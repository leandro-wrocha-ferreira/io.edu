server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.php index.html;

    # Prohibit direct access to application, system, and other internal directories
    location ^~ /application/ {
        deny all;
        return 403;
    }

    location ^~ /system/ {
        deny all;
        return 403;
    }

    location ^~ /vendor/ {
        deny all;
        return 403;
    }

    location ^~ /docker/ {
        deny all;
        return 403;
    }

    location ^~ /tests/ {
        deny all;
        return 403;
    }

    # Deny access to hidden files and directories (.git, .env, etc.)
    location ~ /\. {
        deny all;
        return 403;
    }

    # Allow direct access to public static assets (images, css, js, fonts)
    location ~* \.(css|js|jpe?g|png|gif|ico|svg|webp|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # Main routing through front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # FastCGI execution exclusively for index.php
    location = /index.php {
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Deny direct execution of any other PHP scripts
    location ~ \.php$ {
        deny all;
        return 403;
    }
}
